<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notification Email Template</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f0f0;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
        style="background-color: #f0f0f0; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                    style="max-width: 600px; background: #ffffff; border-radius: 12px; overflow: hidden;">

                    <!-- Header with Logo -->
                    <tr>
                        <td style="background: #2B7FFF; padding: 20px 40px 40px; text-align: center;">
                            <img src="/images/email-logo-white.png" alt="My Customs" width="120"
                                style="display: block; margin: 0 auto 24px;">
                            <p
                                style="color: rgba(255,255,255,0.9); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 8px;">
                                New Enquiry</p>
                            <h1 style="color: white; margin: 0; font-size: 24px; font-weight: 500;">Contact Form
                                Submission</h1>
                        </td>
                    </tr>

                    <!-- Contact Details -->
                    <tr>
                        <td style="padding: 40px 40px 32px;">
                            <p
                                style="color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 16px;">
                                Contact Details</p>

                            <div style="background: #f8f9fa; border-radius: 12px; padding: 4px 20px;">
                                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                                    <tr>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee;">
                                            <span style="color: #888; font-size: 13px;">Name</span>
                                        </td>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee; text-align: right;">
                                            <span
                                                style="color: #333; font-size: 14px; font-weight: 500;">{{name}}</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee;">
                                            <span style="color: #888; font-size: 13px;">Company</span>
                                        </td>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee; text-align: right;">
                                            <span
                                                style="color: #333; font-size: 14px; font-weight: 500;">{{company}}</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee;">
                                            <span style="color: #888; font-size: 13px;">Email</span>
                                        </td>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee; text-align: right;">
                                            <a href="mailto:{{email}}"
                                                style="color: #3871C1; font-size: 14px; text-decoration: none; font-weight: 500;">{{email}}</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee;">
                                            <span style="color: #888; font-size: 13px;">Phone</span>
                                        </td>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee; text-align: right;">
                                            <a href="tel:{{phone}}"
                                                style="color: #3871C1; font-size: 14px; text-decoration: none; font-weight: 500;">{{phone}}</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee;">
                                            <span style="color: #888; font-size: 13px;">Service</span>
                                        </td>
                                        <td style="padding: 14px 0; border-bottom: 1px solid #eee; text-align: right;">
                                            <span
                                                style="color: #333; font-size: 14px; font-weight: 500;">{{service}}</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0;">
                                            <span style="color: #888; font-size: 13px;">Message</span>
                                        </td>
                                        <td style="padding: 14px 0; text-align: right;">
                                            <span
                                                style="color: #333; font-size: 14px; font-weight: 500;">{{message}}</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <!-- CTA -->
                            <div style="margin-top: 32px; text-align: center;">
                                <a href="mailto:{{email}}"
                                    style="display: inline-block; background: #3871C1; color: white; padding: 14px 36px; text-decoration: none; border-radius: 50px; font-weight: 500; font-size: 14px;">
                                    Reply to Customer
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background: #111A2E; padding: 28px 40px; text-align: center;">
                            <p style="color: #fff; font-size: 14px; font-weight: 500; margin: 0 0 6px;">My Customs</p>
                            <p style="color: #888; font-size: 11px; margin: 0;">© {{currentYear}} My Customs. All rights
                                reserved.</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
